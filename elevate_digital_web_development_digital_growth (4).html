<style>
:root{
  --paper:#fafafa;
  --carbon:#09090b;
  --carbon-card:#111115;
  --ink:#09090b;
  --muted:#52525b;
  --light-muted:#a1a1aa;
  --card:#fafafa;
  --line:rgba(9,9,11,.12);
  --line-dark:rgba(255,255,255,.14);
  --accent:#7c3aed;
  --accent-light:#a78bfa;
  --accent-deep:#5b21b6;
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}

/* Mandatory Bold & Strict Non-Italic Typography for Headings & Accents */
h1,h2,h3{font-family:var(--sans)!important;font-weight:700!important;font-style:normal!important;margin:0;line-height:1.04;letter-spacing:-.03em}
h1 em,h2 em,h3 em,.logo em,span.em{font-style:normal!important;font-weight:700!important}
a{color:inherit}

/* Interactive Action Buttons */
.btn{display:inline-flex;gap:.55rem;align-items:center;justify-content:center;background:var(--carbon);color:#fff;border-radius:999px;padding:.9rem 1.65rem;font-size:.92rem;text-decoration:none;font-weight:600;border:1px solid transparent;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,background .25s ease,border-color .25s ease}
.btn:hover{transform:translateY(-2px);background:var(--accent);box-shadow:0 12px 28px rgba(124,58,237,.35)}
.btn.accent{background:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-light);color:var(--carbon);box-shadow:0 12px 30px rgba(167,139,250,.38)}
.btn.light{background:#fff;color:var(--carbon)}
.btn.light:hover{background:var(--accent);color:#fff;box-shadow:0 12px 30px rgba(124,58,237,.35)}
.btn.outline{background:rgba(250,250,250,.9);color:var(--carbon);border:1px solid rgba(9,9,11,.18);backdrop-filter:blur(8px)}
.btn.outline:hover{border-color:var(--accent);color:var(--accent);background:#fff;box-shadow:0 10px 24px rgba(9,9,11,.08)}

/* Full-Screen Preloader */
#pre{position:fixed;inset:0;z-index:100;background:var(--carbon);transition:transform .95s cubic-bezier(.77,0,.18,1)}
#pre.done{transform:translateY(-101%);pointer-events:none}
#pre svg{position:absolute;inset:0;width:100%;height:100%}
#pct{position:absolute;right:clamp(20px,4vw,56px);bottom:clamp(16px,4vw,44px);font:700 clamp(2.4rem,7vw,5rem)/1 var(--sans)!important;font-style:normal!important;color:var(--accent-light);letter-spacing:-.03em}
#pre .cone{animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.72}to{opacity:1}}

/* Header Navigation Bar */
header{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(14px,3vw,34px);pointer-events:none;transition:top .3s ease}
header>*{pointer-events:auto}
.logo{background:#fff;color:var(--carbon);font:700 clamp(1.25rem,2.4vw,1.65rem)/1 var(--sans)!important;font-style:normal!important;padding:.55rem 1.15rem;border-radius:12px;text-decoration:none;white-space:nowrap;border:1px solid rgba(9,9,11,.08);box-shadow:0 8px 26px rgba(9,9,11,.12);letter-spacing:-.03em}
.logo em{background:linear-gradient(100deg,var(--accent),var(--accent-light));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border:1px solid rgba(9,9,11,.08);border-radius:12px;padding:.35rem;display:flex;gap:.15rem;box-shadow:0 8px 26px rgba(9,9,11,.08)}
nav a{color:var(--carbon);text-decoration:none;font-size:.85rem;font-weight:600;padding:.5rem .95rem;border-radius:8px;transition:background .2s,color .2s}
nav a:hover{background:rgba(124,58,237,.1);color:var(--accent)}
header .btn{padding:.65rem 1.2rem;font-size:.85rem;border-radius:10px}
@media(max-width:890px){nav{display:none}}
@media(max-width:520px){header .btn{padding:.55rem .9rem;font-size:.78rem}}

/* Mobile Preview Toggle & Device Simulator Frame */
.viewport-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:85;display:inline-flex;align-items:center;gap:6px;background:rgba(9,9,11,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);padding:6px;border-radius:999px;box-shadow:0 14px 36px rgba(0,0,0,.45)}
.vp-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--light-muted);font:600 .78rem/1 var(--sans);padding:8px 14px;border-radius:999px;cursor:pointer;transition:all .2s ease}
.vp-btn.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.4)}
.vp-btn:hover:not(.active){color:#fff}
@media(max-width:520px){.viewport-bar{display:none}}

html.mobile-sim{background:#18181b;padding:24px 0 84px;display:flex;justify-content:center}
html.mobile-sim body{width:390px;max-width:390px;min-height:844px;border-radius:42px;border:10px solid #09090b;box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 0 2px rgba(255,255,255,.12);overflow-x:hidden;position:relative;margin:0 auto}
html.mobile-sim header{width:370px;left:50%;transform:translateX(-50%);top:34px;padding:10px 14px}
html.mobile-sim nav{display:none}
html.mobile-sim .logo{font-size:1.1rem!important;padding:.45rem .85rem}
html.mobile-sim header .btn{padding:.5rem .85rem;font-size:.76rem}
html.mobile-sim .hero{padding:96px 16px 56px}
html.mobile-sim .hero-wrapper{grid-template-columns:1fr;text-align:center;gap:28px}
html.mobile-sim .hero-content{text-align:center}
html.mobile-sim .hero h1{font-size:2.25rem}
html.mobile-sim .hero p{font-size:.94rem;margin:0 auto 1.5rem}
html.mobile-sim .hero-actions{justify-content:center}
html.mobile-sim .hero-widget{padding:18px}
html.mobile-sim .hw-metrics{gap:6px}
html.mobile-sim .hw-metric b{font-size:.95rem}
html.mobile-sim .phases,html.mobile-sim .cards,html.mobile-sim .guarantee-bar,html.mobile-sim .offices{grid-template-columns:1fr}
html.mobile-sim .phases::before{display:none}
html.mobile-sim .bars{grid-template-columns:repeat(2,1fr);height:auto}
html.mobile-sim .bar{height:210px}
html.mobile-sim #team h2,html.mobile-sim #team .lead{text-align:left}
html.mobile-sim .team article{grid-template-columns:1fr;row-gap:16px}
html.mobile-sim .team .ph{aspect-ratio:16/9}
html.mobile-sim .team article>:not(.ph){grid-column:1}
html.mobile-sim .view{width:370px;left:50%;transform:translateX(-50%);top:34px;bottom:84px;border-radius:32px;padding:18px 12px}

<script>
(function(){
  /* 0. Mobile Preview Mode Activation */
  var btnMobileVp=document.getElementById("btnMobileVp");
  var btnDesktopVp=document.getElementById("btnDesktopVp");
  function setMobileSim(enable){
    document.documentElement.classList.toggle("mobile-sim",enable);
    if(btnMobileVp)btnMobileVp.classList.toggle("active",enable);
    if(btnDesktopVp)btnDesktopVp.classList.toggle("active",!enable);
    window.dispatchEvent(new Event("resize"));
  }
  if(window.innerWidth>520){setMobileSim(true);}
  if(btnMobileVp)btnMobileVp.addEventListener("click",function(){setMobileSim(true);});
  if(btnDesktopVp)btnDesktopVp.addEventListener("click",function(){setMobileSim(false);});

  /* 1. Preloader Percentage & Reveal */
  var pre=document.getElementById("pre"),pct=document.getElementById("pct"),n=0;
  function reveal(){pre.classList.add("done");document.body.classList.remove("lock");}
  var t=setInterval(function(){
    n+=Math.ceil(Math.random()*7);
    if(n>=100){n=100;clearInterval(t);setTimeout(reveal,280);}
    pct.textContent=n+"%";
  },55);

  /* 2. Shutter Bars Setup */
  var sh=document.getElementById("shut"),h="";
  for(var i=0;i<9;i++){h+='<i style="--w:'+(100-i*10)+'%;transition-delay:'+(i*65)+'ms"></i>';}
  sh.innerHTML=h;

  /* 3. Hero Canvas - Connected Network, Proximity Physics & Shockwaves */
  var canvas=document.getElementById("heroCanvas");
  if(canvas && canvas.getContext){
    var ctx=canvas.getContext("2d"),w,ch,nodes=[],pulses=[],shockwaves=[],mouse={x:-9999,y:-9999};
    function resizeCanvas(){
      var rect=canvas.parentElement.getBoundingClientRect();
      w=canvas.width=rect.width;
      ch=canvas.height=rect.height;
      var count=Math.min(58,Math.max(26,Math.floor((w*ch)/20000)));
      nodes=[];
      for(var k=0;k<count;k++){
        nodes.push({
          x:Math.random()*w,
          y:Math.random()*ch,
          vx:(Math.random()-.5)*.5,
          vy:(Math.random()-.5)*.5,
          r:Math.random()*1.8+1.4,
          baseX:0,baseY:0
        });
      }
    }
    window.addEventListener("resize",resizeCanvas);
    resizeCanvas();

    canvas.parentElement.addEventListener("mousemove",function(e){
      var r=canvas.getBoundingClientRect();
      mouse.x=e.clientX-r.left;
      mouse.y=e.clientY-r.top;
    });
    canvas.parentElement.addEventListener("mouseleave",function(){mouse.x=-9999;mouse.y=-9999;});
    
    // Shockwave on click
    canvas.parentElement.addEventListener("click",function(e){
      var r=canvas.getBoundingClientRect();
      shockwaves.push({x:e.clientX-r.left,y:e.clientY-r.top,radius:0,maxRadius:140,alpha:1});
    });

    // Random data pulses traveling between connected nodes
    setInterval(function(){
      if(nodes.length<2)return;
      var aIdx=Math.floor(Math.random()*nodes.length);
      var bIdx=Math.floor(Math.random()*nodes.length);
      if(aIdx!==bIdx){
        var pA=nodes[aIdx],pB=nodes[bIdx];
        if(Math.hypot(pA.x-pB.x,pA.y-pB.y)<160){
          pulses.push({from:pA,to:pB,progress:0,speed:0.02+Math.random()*0.02});
        }
      }
    },350);

    function drawHeroCanvas(){
      ctx.clearRect(0,0,w,ch);

      // Render & update shockwaves
      for(var sw=shockwaves.length-1;sw>=0;sw--){
        var wave=shockwaves[sw];
        wave.radius+=3.5;
        wave.alpha=1-(wave.radius/wave.maxRadius);
        if(wave.alpha<=0){shockwaves.splice(sw,1);continue;}
        ctx.strokeStyle="rgba(124,58,237,"+wave.alpha*0.6+")";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.arc(wave.x,wave.y,wave.radius,0,Math.PI*2);
        ctx.stroke();
      }

      // Update node positions with cursor gravity
      for(var a=0;a<nodes.length;a++){
        var p=nodes[a];
        
        var mDist=Math.hypot(p.x-mouse.x,p.y-mouse.y);
        if(mDist<200 && mDist>0){
          var gForce=(200-mDist)/200*0.4;
          p.x+=(mouse.x-p.x)/mDist*gForce;
          p.y+=(mouse.y-p.y)/mDist*gForce;
        }

        p.x+=p.vx;p.y+=p.vy;
        if(p.x<0||p.x>w)p.vx*=-1;
        if(p.y<0||p.y>ch)p.vy*=-1;

        // Draw connections
        for(var b=a+1;b<nodes.length;b++){
          var q=nodes[b],dx=p.x-q.x,dy=p.y-q.y,dist=Math.hypot(dx,dy);
          if(dist<150){
            ctx.strokeStyle="rgba(124,58,237,"+((1-dist/150)*0.18)+")";
            ctx.lineWidth=1;
            ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
          }
        }

        // Draw line to mouse
        if(mDist<180){
          ctx.strokeStyle="rgba(124,58,237,"+((1-mDist/180)*0.45)+")";
          ctx.lineWidth=1.2;
          ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();
        }

        // Draw node dot
        ctx.fillStyle=mDist<180?"rgba(124,58,237,0.9)":"rgba(9,9,11,0.24)";
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      }

      // Draw packet pulses sliding along edges
      for(var pl=pulses.length-1;pl>=0;pl--){
        var pulse=pulses[pl];
        pulse.progress+=pulse.speed;
        if(pulse.progress>=1){pulses.splice(pl,1);continue;}
        var px=pulse.from.x+(pulse.to.x-pulse.from.x)*pulse.progress;
        var py=pulse.from.y+(pulse.to.y-pulse.from.y)*pulse.progress;
        ctx.fillStyle="#7c3aed";
        ctx.shadowColor="#a78bfa";
        ctx.shadowBlur=8;
        ctx.beginPath();
        ctx.arc(px,py,3,0,Math.PI*2);
        ctx.fill();
        ctx.shadowBlur=0;
      }

      requestAnimationFrame(drawHeroCanvas);
    }
    drawHeroCanvas();
  }

  /* 4. Telemetry Tab Switcher */
  var hwTabs=querySelectorAll(".hw-tab");
  var hwPanels=querySelectorAll(".hw-panel");
  var hwCtaBtn=document.getElementById("hwCtaBtn");
  var activeTabIdx=0,tabTimer;

  function setHwTab(idx){
    activeTabIdx=idx;
    hwTabs.forEach(function(t,i){
      t.classList.toggle("active",i===idx);
    });
    hwPanels.forEach(function(p,i){
      p.classList.toggle("active",i===idx);
    });
    if(hwCtaBtn && hwTabs[idx]){
      hwCtaBtn.setAttribute("data-service",hwTabs[idx].getAttribute("data-service"));
    }
  }

  hwTabs.forEach(function(tab,idx){
    tab.addEventListener("click",function(){
      clearInterval(tabTimer);
      setHwTab(idx);
    });
  });

  tabTimer=setInterval(function(){
    setHwTab((activeTabIdx+1)%hwTabs.length);
  },4000);

  function querySelectorAll(sel){return Array.prototype.slice.call(document.querySelectorAll(sel));}

  /* 5. Magnetic Radial Spotlight on Cards */
  document.querySelectorAll(".card").forEach(function(card){
    card.addEventListener("mousemove",function(e){
      var r=card.getBoundingClientRect();
      card.style.setProperty("--mx",(e.clientX-r.left)+"px");
      card.style.setProperty("--my",(e.clientY-r.top)+"px");
    });
  });

  /* 6. Scroll Reveal & Metric Count-Up Animation */
  var counted=false;
  function animateCounters(){
    if(counted)return;
    counted=true;
    document.querySelectorAll(".count").forEach(function(el){
      var target=parseInt(el.getAttribute("data-target"),10);
      var suffix=el.getAttribute("data-suffix")||"";
      var dur=1200,t0=performance.now();
      function step(now){
        var p=Math.min(1,(now-t0)/dur);
        var val=Math.round(target*(1-Math.pow(1-p,3)));
        el.textContent=val+suffix;
        if(p<1)requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add("in");
        if(e.target.id==="bars")animateCounters();
        io.unobserve(e.target);
      }
    });
  },{threshold:.18});
  document.querySelectorAll(".rv,#shut,#bars").forEach(function(el){io.observe(el);});

  /* 7. Sign Up Modal & Direct Click Handlers */
  var su=document.getElementById("signup");
  var suService=document.getElementById("suService");
  function openSignup(serviceName){
    if(serviceName && suService){
      for(var idx=0;idx<suService.options.length;idx++){
        if(suService.options[idx].value===serviceName){
          suService.selectedIndex=idx;
          break;
        }
      }
    }
    su.hidden=false;
    document.body.classList.add("su-open");
    su.scrollTop=0;
  }
  function closeSignup(){
    su.hidden=true;
    document.body.classList.remove("su-open");
    if(location.hash==="#signup" && history.replaceState){
      history.replaceState(null,"",location.pathname+location.search);
    }
  }

  document.querySelectorAll(".js-open-signup").forEach(function(btn){
    btn.addEventListener("click",function(e){
      e.preventDefault();
      openSignup(btn.getAttribute("data-service"));
    });
  });
  document.querySelectorAll(".js-close-signup").forEach(function(btn){
    btn.addEventListener("click",function(e){
      e.preventDefault();
      closeSignup();
    });
  });
  su.addEventListener("click",function(e){
    if(e.target===su)closeSignup();
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape" && !su.hidden)closeSignup();
  });

  document.querySelectorAll('a[href^="#"]:not(.js-open-signup):not(.js-close-signup)').forEach(function(link){
    link.addEventListener("click",function(e){
      var id=link.getAttribute("href");
      if(id && id.length>1){
        var target=document.querySelector(id);
        if(target){
          e.preventDefault();
          target.scrollIntoView({behavior:"smooth"});
        }
      }
    });
  });

  /* 8. Vercel Backend Submission Handler (Secured & No Redirect) */
  var suForm = document.getElementById("suForm");
  if (suForm) {
    suForm.addEventListener("submit", async function(e) {
      e.preventDefault(); // FIX: Completely prevents browser redirection
      
      var f = e.target;
      var btn = document.getElementById("suSubmit");
      var msgEl = document.getElementById("suMsg");
      
      var payload = {
        name: f.elements.name ? f.elements.name.value.trim() : "",
        email: f.elements.email ? f.elements.email.value.trim() : "",
        phone: f.elements.phone ? f.elements.phone.value.trim() : "",
        company: f.elements.company ? f.elements.company.value.trim() : "",
        service: f.elements.service ? f.elements.service.value : "",
        msg: f.elements.msg ? f.elements.msg.value.trim() : ""
      };
      
      var originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Sending securely...";
      msgEl.textContent = "";
      msgEl.style.color = "";
      
      // Detect sandboxed preview (blob:, file:, data:) where relative /api/signup URLs cannot resolve
      var isPreview = window.location.protocol === "blob:" || window.location.protocol === "file:" || window.location.protocol === "data:";
      
      if (isPreview) {
        setTimeout(function() {
          msgEl.textContent = "✓ [Preview Mode] Inquiry validated! Ready for live /api/signup on Vercel.";
          msgEl.style.color = "#10B981";
          f.reset();
          btn.disabled = false;
          btn.textContent = originalText;
          
          setTimeout(function() {
            closeSignup();
            msgEl.textContent = "";
          }, 2600);
        }, 650);
        return;
      }

      try {
        var res = await fetch("/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        
        var data = await res.json();
        
        if (res.ok && data.success) {
          msgEl.textContent = "✓ Inquiry sent securely. We'll reply within 24 hours.";
          msgEl.style.color = "#10B981"; // Success green
          f.reset();
          
          setTimeout(function() {
            closeSignup();
            msgEl.textContent = "";
          }, 3000);
        } else {
          throw new Error((data && data.error) || "Submission error");
        }
      } catch (err) {
        console.error("API Error:", err);
        var body = "Name: " + payload.name + "\nEmail: " + payload.email + "\nPhone: " + payload.phone + "\nCompany: " + payload.company + "\nInterested in: " + payload.service + "\n\nMessage:\n" + payload.msg;
        
        msgEl.innerHTML = 'Server unreachable. <a style="color:#A78BFA;text-decoration:underline" href="mailto:elevatedigital984@gmail.com?subject=' + encodeURIComponent("Project Inquiry: " + payload.name) + '&body=' + encodeURIComponent(body) + '">Click here to send via email ↗</a>';
        msgEl.style.color = "#EF4444"; // Error red
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  }
})();
</script>
